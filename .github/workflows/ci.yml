name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore dependencies
        run: dotnet restore PickleCrew.slnx

      - name: Build
        run: dotnet build PickleCrew.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test PickleCrew.slnx --configuration Release --no-build --no-restore

      - name: Check for pending EF Core model changes
        run: >-
          dotnet ef migrations has-pending-model-changes
          --project src/PickleCrew.Api/PickleCrew.Api.csproj
          --startup-project src/PickleCrew.Api/PickleCrew.Api.csproj
          --context PickleCrewDbContext
          --configuration Release
          --no-build
          --no-color
