name: ci/cd

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.event_name == 'pull_request' && github.ref || github.ref_type == 'tag' && 'production' || 'development' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore dependencies
        run: dotnet restore PickleCrew.slnx

      - name: Build
        run: dotnet build PickleCrew.slnx --configuration Release --no-restore

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.20.0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: pnpm
          cache-dependency-path: src/PickleCrew.Web/pnpm-lock.yaml

      - name: Install Web dependencies
        working-directory: src/PickleCrew.Web
        run: pnpm install --frozen-lockfile

      - name: Generate typed API client
        working-directory: src/PickleCrew.Web
        run: pnpm api:generate

      - name: Validate generated API client is current
        run: |
          set -euo pipefail

          changes="$(git status --porcelain --untracked-files=all -- src/PickleCrew.Web/src/lib/api)"
          if [[ -n "$changes" ]]; then
            echo "$changes"
            echo "Generated API client is stale. Regenerate and commit it." >&2
            exit 1
          fi

      - name: Validate generated Workers types
        working-directory: src/PickleCrew.Web
        run: pnpm cf-typegen --check

      - name: Build and validate Web Worker environments
        working-directory: src/PickleCrew.Web
        run: |
          set -euo pipefail

          for environment in development production; do
            CLOUDFLARE_ENV="$environment" pnpm build
            pnpm exec wrangler deploy --dry-run
          done

      - name: Set up Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Validate Fly configurations
        env:
          # flyctl requires a token even though validation is local when a config is provided.
          FLY_API_TOKEN: local-config-validation
        run: |
          set -euo pipefail

          for config in infra/api/*.toml; do
            flyctl config validate --strict --config "$config"
          done

      - name: Test
        run: dotnet test PickleCrew.slnx --configuration Release --no-build --no-restore

      - name: Check for pending EF Core model changes
        run: >-
          dotnet ef migrations has-pending-model-changes
          --project src/PickleCrew.Api/PickleCrew.Api.csproj
          --startup-project src/PickleCrew.Api/PickleCrew.Api.csproj
          --context PickleCrewDbContext
          --configuration Release
          --no-build
          --no-color

      - name: Generate EF Core migration script
        run: |
          mkdir -p "$RUNNER_TEMP/ef-migrations"

          dotnet ef migrations script \
            --idempotent \
            --project src/PickleCrew.Api/PickleCrew.Api.csproj \
            --startup-project src/PickleCrew.Api/PickleCrew.Api.csproj \
            --context PickleCrewDbContext \
            --configuration Release \
            --no-build \
            --no-color \
            --output "$RUNNER_TEMP/ef-migrations/migrations.sql"

      - name: Upload EF Core migration script
        uses: actions/upload-artifact@v7
        with:
          name: ef-migrations
          path: ${{ runner.temp }}/ef-migrations/migrations.sql
          if-no-files-found: error
          retention-days: 7

      - name: Build API container
        run: >-
          docker build
          --platform linux/amd64
          --file src/PickleCrew.Api/Dockerfile
          --tag picklecrew-api:ci
          .

  deploy-api:
    name: deploy API ${{ github.ref_type == 'tag' && 'production' || 'development' }}
    if: github.event_name == 'push'
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      deployments: write
    environment:
      name: ${{ github.ref_type == 'tag' && 'production' || 'development' }}
      url: ${{ github.ref_type == 'tag' && 'https://api.picklecrew.app' || 'https://api.dev.picklecrew.app' }}
    env:
      FLY_CONFIG: ${{ github.ref_type == 'tag' && 'infra/api/production.toml' || 'infra/api/development.toml' }}
      FLY_HOSTNAME: ${{ github.ref_type == 'tag' && 'https://picklecrew-api-production.fly.dev' || 'https://picklecrew-api-development.fly.dev' }}
      DEPLOYMENT_URL: ${{ github.ref_type == 'tag' && 'https://api.picklecrew.app' || 'https://api.dev.picklecrew.app' }}

    steps:
      - name: Validate production release tag
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Production tags must use stable SemVer (vMAJOR.MINOR.PATCH)." >&2
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Download EF Core migration script
        uses: actions/download-artifact@v8
        with:
          name: ef-migrations
          path: ${{ runner.temp }}/ef-migrations

      - name: Validate EF Core migration script
        run: test -s "$RUNNER_TEMP/ef-migrations/migrations.sql"

      - name: Apply database migrations
        env:
          MIGRATIONS_DATABASE_URL: ${{ secrets.MIGRATIONS_DATABASE_URL }}
        run: |
          set -euo pipefail

          : "${MIGRATIONS_DATABASE_URL:?MIGRATIONS_DATABASE_URL is required}"
          test -s "$RUNNER_TEMP/ef-migrations/migrations.sql"

          psql "$MIGRATIONS_DATABASE_URL" \
            --no-psqlrc \
            --set ON_ERROR_STOP=1 \
            --file "$RUNNER_TEMP/ef-migrations/migrations.sql"

      - name: Set up Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Stage Fly runtime secret
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          DATABASE_CONNECTION_STRING: ${{ secrets.DATABASE_CONNECTION_STRING }}
        run: |
          set -euo pipefail

          : "${FLY_API_TOKEN:?FLY_API_TOKEN is required}"
          : "${DATABASE_CONNECTION_STRING:?DATABASE_CONNECTION_STRING is required}"

          flyctl secrets set \
            --stage \
            --config "$FLY_CONFIG" \
            "ConnectionStrings__picklecrew=${DATABASE_CONNECTION_STRING}"

      - name: Deploy API to Fly
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail

          : "${FLY_API_TOKEN:?FLY_API_TOKEN is required}"
          flyctl deploy . --config "$FLY_CONFIG"

      - name: Smoke-test Fly hostname
        run: |
          set -euo pipefail

          for endpoint in alive health; do
            curl \
              --fail \
              --silent \
              --show-error \
              --retry 20 \
              --retry-all-errors \
              --retry-delay 10 \
              --retry-max-time 300 \
              --max-time 30 \
              "$FLY_HOSTNAME/$endpoint"
          done

      - name: Smoke-test Cloudflare custom domain
        run: |
          set -euo pipefail

          for endpoint in alive health; do
            curl \
              --fail \
              --silent \
              --show-error \
              --retry 20 \
              --retry-all-errors \
              --retry-delay 10 \
              --retry-max-time 300 \
              --max-time 30 \
              "$DEPLOYMENT_URL/$endpoint"
          done

  deploy-web:
    name: deploy Web ${{ github.ref_type == 'tag' && 'production' || 'development' }}
    if: github.event_name == 'push'
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      deployments: write
    environment:
      name: ${{ github.ref_type == 'tag' && 'production' || 'development' }}
      url: ${{ github.ref_type == 'tag' && 'https://picklecrew.app' || 'https://dev.picklecrew.app' }}
    env:
      DEPLOYMENT_ENVIRONMENT: ${{ github.ref_type == 'tag' && 'production' || 'development' }}
      DEPLOYMENT_URL: ${{ github.ref_type == 'tag' && 'https://picklecrew.app' || 'https://dev.picklecrew.app' }}

    steps:
      - name: Validate production release tag
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Production tags must use stable SemVer (vMAJOR.MINOR.PATCH)." >&2
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.20.0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: pnpm
          cache-dependency-path: src/PickleCrew.Web/pnpm-lock.yaml

      - name: Install Web dependencies
        working-directory: src/PickleCrew.Web
        run: pnpm install --frozen-lockfile

      - name: Build Web Worker
        working-directory: src/PickleCrew.Web
        env:
          CLOUDFLARE_ENV: ${{ env.DEPLOYMENT_ENVIRONMENT }}
        run: pnpm build

      - name: Deploy Web Worker
        working-directory: src/PickleCrew.Web
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail

          : "${CLOUDFLARE_ACCOUNT_ID:?CLOUDFLARE_ACCOUNT_ID is required}"
          : "${CLOUDFLARE_API_TOKEN:?CLOUDFLARE_API_TOKEN is required}"

          pnpm exec wrangler deploy

      - name: Smoke-test Web custom domain
        run: >-
          curl
          --fail
          --silent
          --show-error
          --retry 20
          --retry-all-errors
          --retry-delay 10
          --retry-max-time 300
          --max-time 30
          "$DEPLOYMENT_URL/"
