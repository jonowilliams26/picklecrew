name: ci/cd

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.event_name == 'pull_request' && github.ref || github.ref_type == 'tag' && 'production' || 'development' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' }}

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore dependencies
        run: dotnet restore PickleCrew.slnx

      - name: Build
        run: dotnet build PickleCrew.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test PickleCrew.slnx --configuration Release --no-build --no-restore

      - name: Check for pending EF Core model changes
        run: >-
          dotnet ef migrations has-pending-model-changes
          --project src/PickleCrew.Api/PickleCrew.Api.csproj
          --startup-project src/PickleCrew.Api/PickleCrew.Api.csproj
          --context PickleCrewDbContext
          --configuration Release
          --no-build
          --no-color

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: infra/api/package-lock.json

      - name: Install Worker dependencies
        working-directory: infra/api
        run: npm ci

      - name: Test Worker
        working-directory: infra/api
        run: npm test

      - name: Type-check Worker
        working-directory: infra/api
        run: npm run typecheck

      - name: Validate Wrangler types
        working-directory: infra/api
        run: npm run check:wrangler-types

      - name: Build API container
        run: >-
          docker build
          --platform linux/amd64
          --file src/PickleCrew.Api/Dockerfile
          --tag picklecrew-api:ci
          .

  deploy:
    name: deploy ${{ github.ref_type == 'tag' && 'production' || 'development' }}
    if: github.event_name == 'push'
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      deployments: write
    environment:
      name: ${{ github.ref_type == 'tag' && 'production' || 'development' }}
      url: ${{ github.ref_type == 'tag' && 'https://api.picklecrew.app' || 'https://api.dev.picklecrew.app' }}
    env:
      DEPLOYMENT_ENVIRONMENT: ${{ github.ref_type == 'tag' && 'production' || 'development' }}
      DEPLOYMENT_URL: ${{ github.ref_type == 'tag' && 'https://api.picklecrew.app' || 'https://api.dev.picklecrew.app' }}

    steps:
      - name: Validate production release tag
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Production tags must use stable SemVer (vMAJOR.MINOR.PATCH)." >&2
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: infra/api/package-lock.json

      - name: Install Worker dependencies
        working-directory: infra/api
        run: npm ci

      - name: Deploy API
        working-directory: infra/api
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DATABASE_CONNECTION_STRING: ${{ secrets.DATABASE_CONNECTION_STRING }}
        run: |
          set -euo pipefail
          umask 077

          : "${DATABASE_CONNECTION_STRING:?DATABASE_CONNECTION_STRING is required}"

          secrets_file="$RUNNER_TEMP/wrangler-secrets.json"
          trap 'rm -f "$secrets_file"' EXIT

          jq -n \
            '{"DATABASE_CONNECTION_STRING": env.DATABASE_CONNECTION_STRING}' \
            > "$secrets_file"

          npx wrangler deploy \
            --env "$DEPLOYMENT_ENVIRONMENT" \
            --secrets-file "$secrets_file"

      - name: Smoke-test API readiness
        run: >-
          curl
          --fail
          --silent
          --show-error
          --retry 20
          --retry-all-errors
          --retry-delay 10
          --retry-max-time 300
          --max-time 30
          "$DEPLOYMENT_URL/health"
