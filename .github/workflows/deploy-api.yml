name: Deploy API

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-api-${{ github.ref == 'refs/heads/main' && 'development' || 'production' }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy ${{ github.ref_type == 'tag' && 'production' || 'development' }}
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: ${{ github.ref_type == 'tag' && 'production' || 'development' }}
      url: ${{ github.ref_type == 'tag' && 'https://api.picklecrew.app' || 'https://dev.api.picklecrew.app' }}
    env:
      DEPLOYMENT_ENVIRONMENT: ${{ github.ref_type == 'tag' && 'production' || 'development' }}
      DEPLOYMENT_URL: ${{ github.ref_type == 'tag' && 'https://api.picklecrew.app' || 'https://dev.api.picklecrew.app' }}

    steps:
      - name: Validate production release tag
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Production tags must use stable SemVer (vMAJOR.MINOR.PATCH)." >&2
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: infra/api/package-lock.json

      - name: Install Worker dependencies
        working-directory: infra/api
        run: npm ci

      - name: Deploy API
        working-directory: infra/api
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy --env "$DEPLOYMENT_ENVIRONMENT"

      - name: Smoke-test API
        run: >-
          curl
          --fail
          --silent
          --show-error
          --retry 20
          --retry-all-errors
          --retry-delay 10
          --retry-max-time 300
          --max-time 30
          "$DEPLOYMENT_URL/alive"
